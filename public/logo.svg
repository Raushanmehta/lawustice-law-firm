<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%" fill="currentColor">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Playfair+Display:ital,wght@0,700;0,800;1,700&amp;display=swap');
      .logo-monogram {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif;
        font-size: 82px;
        font-weight: 700;
        letter-spacing: -2px;
      }
      .logo-text {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', 'Georgia', serif;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 7px;
      }
    </style>
  </defs>
  <!-- LJ Monogram -->
  <text x="10" y="86" class="logo-monogram" fill="currentColor">LJ</text>
  <!-- LAWUSTICE Wordmark -->
  <text x="135" y="78" class="logo-text" fill="currentColor">LAWUSTICE</text>
</svg>
